project_name: igd_reimplement
seed: 42

dataset:
  name: ag_news  # ag_news | imdb
  text_key: null
  label_key: label
  max_length: 128
  num_labels: null
  # 默认截断样本数：当命令行不传 --max_train_samples/--max_eval_samples 时生效
  default_max_train_samples:
    ag_news: 20000
    imdb: 10000
  default_max_eval_samples:
    ag_news: 7000
    imdb: 10000

model:
  backbone: bert-base-uncased
  dropout: 0.1

training:
  lr: 2.0e-5
  weight_decay: 0.01
  batch_size: 32
  epochs_baseline: 2
  epochs_igd: 10
  warmup_ratio: 0.5
  fp16: false

igd:
  ig_steps: 50
  lambda_grl: 0.2
  am_s: 1.0
  am_m: 0.3
  pseudo_per_example: 1
  # 最大修改比例（按技术路线）
  max_mod_ratio_agnews: 0.3
  max_mod_ratio_imdb: 0.1
  # 同义词候选
  synonym_k: 50
  min_semantic_sim: 0.84
  # 推理阶段 v' 用 0 填充
  use_zero_pseudo_at_infer: true

paths:
  # 相对路径相对于 config.yaml 所在目录；也可用环境变量 IGD_OUTPUT_DIR 覆盖为任意绝对路径
  output_dir: outputs

attack:
  max_mod_ratio_agnews: 0.3
  max_mod_ratio_imdb: 0.1
  min_semantic_sim: 0.84
  synonym_k: 50
  max_queries_multiplier: 1.0

defense_infer:
  enabled: false
  random_mask_trials: 3
  random_mask_ratio: 0.15
  stability_margin: 0.15
  guided_mask_ratio: 0.10
  guided_ig_steps: 8
  min_tokens_to_mask: 1
  max_tokens_to_mask: 4
